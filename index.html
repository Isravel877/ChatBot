<!DOCTYPE html>
<html>

<head>
  <title>Chatbot</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
      scrollbar-width: none;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      background: #eef1f5;
    }

    .js-container {
      width: 100%;
      height: 100%;
    }

    .container-box {
      width: min(1000px, 95%);
      height: 95vh;
      margin: 2.5vh auto;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: #ffffff;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    .chat-header {
      height: 65px;
      min-height: 65px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      background: #51bb51;
      color: #ffffff;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .chat-header p {
      margin: 3px 0 0;
      font-size: 12px;
      opacity: 0.9;
    }

    .chat-messages {
      flex: 1;
      min-height: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      background: #f8f9fb;
    }

    .chat-message {
      display: flex;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .robot-message {
      justify-content: flex-start;
    }

    .user-message {
      justify-content: flex-end;
    }

    .chat-message img {
      width: 38px;
      height: 38px;
      flex: 0 0 38px;
      border-radius: 50%;
      object-fit: cover;
    }

    .message-bubble {
      max-width: 65%;
      margin: 0 10px;
      padding: 11px 15px;
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }

    .message-bubble p {
      margin: 0;
    }

    .robot-message .message-bubble {
      color: #222222;
      background: #ffffff;
      border: 1px solid #e4e6e8;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }

    .user-message .message-bubble {
      color: #ffffff;
      background: #51bb51;
      border-radius: 16px;
      border-bottom-right-radius: 4px;
    }

    .input-section {
      width: 100%;
      min-height: 74px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: #ffffff;
      border-top: 1px solid #e8e8e8;
    }

    .chat-input {
      flex: 1;
      min-width: 0;
      height: 44px;
      padding: 0 16px;
      outline: none;
      border: 1px solid #d8dce0;
      border-radius: 22px;
      background: #f7f8f9;
      font-size: 14px;
      transition: 0.2s;
    }

    .chat-input:focus {
      border-color: #51bb51;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(81, 187, 81, 0.08);
    }

    .button {
      width: 85px;
      min-width: 85px;
      height: 44px;
      border: none;
      border-radius: 22px;
      background: #51bb51;
      color: #ffffff;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    .button:hover {
      background: #3fa83f;
    }

    .button:active {
      transform: scale(0.96);
    }

    @media (max-width: 768px) {
      body {
        background: #ffffff;
        overflow: hidden;
      }

      .container-box {
        width: 100%;
        height: 100dvh;
        margin: 0;
        border-radius: 0;
        box-shadow: none;
      }

      .chat-header {
        height: 62px;
        min-height: 62px;
        padding: 0 16px;
      }

      .chat-header h2 {
        font-size: 18px;
      }

      .chat-header p {
        font-size: 11px;
      }

      .chat-messages {
        padding: 16px 12px;
        overscroll-behavior: contain;
      }

      .chat-message {
        margin-bottom: 13px;
      }

      .chat-message img {
        width: 34px;
        height: 34px;
        flex-basis: 34px;
      }

      .message-bubble {
        max-width: 78%;
        margin: 0 7px;
        padding: 10px 13px;
        font-size: 14px;
        line-height: 1.45;
      }

      .input-section {
        min-height: 68px;
        padding: 10px 12px;
        gap: 8px;
      }

      .chat-input {
        height: 46px;
        padding: 0 15px;
        border-radius: 23px;
        font-size: 15px;
      }

      .button {
        width: 46px;
        min-width: 46px;
        height: 46px;
        padding: 0;
        border-radius: 50%;
        font-size: 0;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .button::before {
        content: "➤";
        font-size: 18px;
      }
    }

    @media (max-width: 380px) {
      .chat-header {
        height: 58px;
        min-height: 58px;
      }

      .chat-messages {
        padding: 12px 9px;
      }

      .message-bubble {
        max-width: 82%;
        font-size: 13px;
        padding: 9px 12px;
      }

      .chat-message img {
        width: 32px;
        height: 32px;
        flex-basis: 32px;
      }

      .input-section {
        padding: 9px;
      }

      .chat-input {
        height: 44px;
        font-size: 14px;
      }

      .button {
        width: 44px;
        min-width: 44px;
        height: 44px;
      }
    }
  </style>
</head>

<body>

  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
  <script src="https://unpkg.com/supersimpledev/Chatbot.js"></script>
  <script src="https://unpkg.com/supersimpledev/babel.js"></script>

  <script type="text/babel">

    function ChatbotInput({ messages, setMessages }) {
      const [inputMsg, setMsg] = React.useState("");

      function sendMessage() {
        if (!inputMsg.trim()) {
          return;
        }

        const newChatmsg = [
          ...messages,
          {
            message: inputMsg,
            sender: "user",
            key: crypto.randomUUID()
          }
        ];

        const response = Chatbot.getResponse(inputMsg);

        setMessages([
          ...newChatmsg,
          {
            message: response,
            sender: "robot",
            key: crypto.randomUUID()
          }
        ]);

        setMsg("");
      }

      function handleKeyDown(event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      }

      return (
        <div className="input-section">
          <input
            className="chat-input"
            type="text"
            placeholder="Message..."
            value={inputMsg}
            onChange={(event) => setMsg(event.target.value)}
            onKeyDown={handleKeyDown}
          />

          <button
            className="button"
            onClick={sendMessage}
          >
            Send
          </button>
        </div>
      );
    }

    function ChatbotMessage({ message, sender }) {
      return (
        <div
          className={`chat-message ${
            sender === "robot"
              ? "robot-message"
              : "user-message"
          }`}
        >

          {sender === "robot" && (
            <img
              src="./robot.jpg"
              alt="Robot"
            />
          )}

          <div className="message-bubble">
            <p>{message}</p>
          </div>

          {sender === "user" && (
            <img
              src="./user.jpg"
              alt="User"
            />
          )}

        </div>
      );
    }

    function App() {
      const [messages, setMessages] = React.useState([]);

      return (
        <div className="container-box">

          <div className="chat-header">
            <div>
              <h2>Chatbot</h2>
              <p>Online • Ready to help</p>
            </div>
          </div>

          <div className="chat-messages">
            {messages.map((message) => (
              <ChatbotMessage
                message={message.message}
                sender={message.sender}
                key={message.key}
              />
            ))}
          </div>

          <ChatbotInput
            messages={messages}
            setMessages={setMessages}
          />

        </div>
      );
    }

    const container = document.querySelector(".js-container");

    ReactDOM
      .createRoot(container)
      .render(<App />);

  </script>

</body>

</html>
