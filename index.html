<!DOCTYPE html>
<html>

<head>
  <title>React Basics</title>

  <style>
    * {
      box-sizing: border-box;
      scrollbar-width: none;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #eef1f5;
    }

    .container-box {
      width: 1000px;
      height: 95vh;
      margin: 2.5vh auto;
      background: white;
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
      height: 95vh;
      display: flex;
      flex-direction: column;
    }


    .chat-header {
      height: 65px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      background: #51bb51;
      color: white;
    }

    .chat-header h2 {
      margin: 0;
      font-size: 20px;
    }

    .chat-header p {
      margin: 3px 0 0;
      font-size: 12px;
      opacity: 0.9;
    }

    .chat-messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background: #f8f9fb;

      display: flex;
      flex-direction: column;
    }


    .chat-messages::-webkit-scrollbar {
      width: 6px;


    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: #c8c8c8;
      border-radius: 10px;
    }

    .chat-messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .chat-message {
      display: flex;
      align-items: flex-end;
      margin-bottom: 16px;
    }

    .robot-message {
      justify-content: flex-start;
    }

    .user-message {
      justify-content: flex-end;
    }

    .chat-message img {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      object-fit: cover;
    }


    .message-bubble {
      max-width: 65%;
      padding: 11px 15px;
      margin: 0 10px;

      font-size: 14px;
      line-height: 1.5;

      word-wrap: break-word;
    }

    .robot-message .message-bubble {
      background: white;
      color: #222;

      border: 1px solid #e4e6e8;

      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }

    .user-message .message-bubble {
      background: #51bb51;
      color: white;

      border-radius: 16px;
      border-bottom-right-radius: 4px;
    }

    .message-bubble p {
      margin: 0;
    }


    .container-1 {
      width: 100%;
      padding: 15px 18px;

      display: flex;
      align-items: center;

      background: white;
      border-top: 1px solid #e8e8e8;
    }


    .chat-input {
      flex: 1;

      height: 44px;

      padding: 0 15px;

      border: 1px solid #d8dce0;
      border-radius: 22px;

      outline: none;

      font-size: 14px;

      background: #f7f8f9;
    }

    .chat-input:focus {
      border-color: #51bb51;
      background: white;
    }


    .button {
      width: 85px;
      height: 44px;

      margin-left: 10px;

      border: none;
      border-radius: 22px;

      background: #51bb51;
      color: white;

      font-size: 14px;
      font-weight: bold;

      cursor: pointer;

      transition: 0.2s;
    }

    .button:hover {
      background: #3fa83f;
    }

    .button:active {
      transform: scale(0.96);
    }

    /* =========================================
   PROFESSIONAL MOBILE CHAT UI
   ========================================= */

    @media screen and (max-width: 600px) {

      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
      }

      body {
        overflow: hidden;
        background: #f5f7fb;
      }

      .container-box {
        width: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
        border: none;
        border-radius: 0;
        box-shadow: none;

        display: flex;
        flex-direction: column;

        background: #ffffff;
      }


      .chat-container {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }


      .chat-messages {
        flex: 1;
        min-height: 0;

        width: 100%;
        box-sizing: border-box;

        padding: 18px 14px 20px;

        overflow-y: auto;
        overflow-x: hidden;

        scroll-behavior: smooth;
      }

      /* Better scrollbar */
      .chat-messages::-webkit-scrollbar {
        width: 4px;
      }

      .chat-messages::-webkit-scrollbar-thumb {
        background: #d1d5db;
        border-radius: 10px;
      }


      .message {
        max-width: 82%;
        font-size: 15px;
        line-height: 1.5;

        padding: 10px 13px;

        border-radius: 16px;

        margin-bottom: 12px;

        word-wrap: break-word;
        overflow-wrap: anywhere;
      }

      .bot-message {
        align-self: flex-start;

        max-width: 82%;

        border-bottom-left-radius: 5px;
      }

      .user-message {
        align-self: flex-end;

        max-width: 82%;

        border-bottom-right-radius: 5px;
      }



      .input-section {
        width: 100%;

        flex-shrink: 0;

        box-sizing: border-box;

        padding: 10px 12px;

        background: #ffffff;

        border-top: 1px solid #e5e7eb;

        display: flex;
        align-items: center;

        gap: 8px;
      }



      .input-section input {
        flex: 1;

        min-width: 0;

        height: 44px;

        box-sizing: border-box;

        border: 1px solid #d9dee7;

        border-radius: 22px;

        padding: 0 16px;

        outline: none;

        font-size: 15px;

        background: #f8fafc;

        transition: 0.2s;
      }

      .input-section input:focus {
        border-color: #6366f1;

        background: #ffffff;

        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.08);
      }


      .input-section button {
        width: 44px;
        height: 44px;

        min-width: 44px;

        padding: 0;

        border: none;

        border-radius: 50%;

        display: flex;
        justify-content: center;
        align-items: center;

        font-size: 0;

        cursor: pointer;

        background: #4f46e5;

        color: white;

        box-shadow: 0 3px 8px rgba(79, 70, 229, 0.25);

        transition: 0.2s;
      }

      /* Send icon */

      .input-section button::after {
        content: "➤";

        font-size: 18px;

        transform: translateX(1px);
      }

      .input-section button:active {
        transform: scale(0.94);
      }



      @media screen and (max-width: 380px) {

        .chat-messages {
          padding-left: 10px;
          padding-right: 10px;
        }

        .message {
          max-width: 86%;
          font-size: 14px;
        }

        .input-section {
          padding: 8px 9px;
          gap: 7px;
        }

        .input-section input {
          height: 42px;
          font-size: 14px;
          padding: 0 14px;
        }

        .input-section button {
          width: 42px;
          height: 42px;
          min-width: 42px;
        }
      }
    }
  </style>



</head>

<body>
  <div class="js-container"></div>

  <script src="https://unpkg.com/supersimpledev/react.js"></script>
  <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

  <script src="https://unpkg.com/supersimpledev/Chatbot.js"></script>

  <script src="https://unpkg.com/supersimpledev/babel.js"></script>
  <script type="text/babel">


    function ChatbotInput({ messages, setMessages }) {
      const [inputMsg, setMsg] = React.useState("");

      function sendMessage() {

        const newChatmsg = [
          ...messages, {
            message: inputMsg,
            sender: "user",
            key: crypto.randomUUID()
          }
        ]

        setMessages(newChatmsg);

        const Response = Chatbot.getResponse(inputMsg);

        setMessages([
          ...newChatmsg, {
            message: Response,
            sender: "robot",
            key: crypto.randomUUID()
          }
        ]);

        setMsg("");
      }

      return (
        <div class="input-section">
          <input
            className="chat-input"
            type="text" placeholder="Send a Message To Chatbot"
            value={inputMsg}
            onChange={(event) => setMsg(event.target.value)}
          />
          <button
            className="button"
            onClick={sendMessage}
          >Send</button>
        </div>
      )
    };

    function ChatbotMessage({ message, sender }) {
      return (
        <div
          className={`chat-message ${sender === "robot" ? "robot-message" : "user-message"
            }`}
        >

          {sender === "robot" && (
            <img
              src="./ChatBotProject/robot.jpg"
              alt="Robot"
            />
          )}

          <div className="message-bubble">
            <p>{message}</p>
          </div>

          {sender === "user" && (
            <img
              src="./ChatBotProject/user.jpg"
              alt="User"
            />
          )}

        </div>
      );
    }


    function App() {

      const [messages, setMessages] = React.useState([]);

      return (
        <div className="container-box">


          <div className="chat-header">
            <div>
              <h2>Chatbot</h2>
              <p>Online • Ready to help</p>
            </div>
          </div>

          <div className="chat-messages">

            {messages.map((message) => (
              <ChatbotMessage
                message={message.message}
                sender={message.sender}
                key={message.key}
              />
            ))}

          </div>


          <ChatbotInput
            messages={messages}
            setMessages={setMessages}
          />

        </div>
      );
    }

    const container = document.querySelector('.js-container');
    ReactDOM.createRoot(container).render(<App />);

  </script>
</body>

</html>
